<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LiveAlerts</title>
  <style>
    :root{--bg:#1d2327;--accent:#63e6be;--text:#f5f7f8}
    body{font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:24px}
    h1{margin-top:0}
    .card{background:#252d32;border:1px solid #344048;border-radius:12px;padding:16px;margin-bottom:16px}
    button{background:var(--accent);border:none;padding:10px 14px;border-radius:8px;cursor:pointer}
    input{padding:9px;border-radius:8px;border:1px solid #4d5c66;background:#12181b;color:var(--text)}
    code{background:#111;padding:2px 5px;border-radius:5px}
  </style>
</head>
<body>
  <h1>LiveAlerts MVP</h1>
  <div class="card">
    <p>Default overlay URL:</p>
    <p><code>http://127.0.0.1:3210/screen/screen-default</code></p>
    <p>Debug URL: <code>http://127.0.0.1:3210/screen/screen-default?debug</code></p>
    <button id="testBtn">Send Test Alert</button>
  </div>
  <div class="card">
    <h3>Create Screen</h3>
    <input id="screenName" placeholder="Screen name" /> <button id="createScreen">Create</button>
    <pre id="output"></pre>
  </div>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
